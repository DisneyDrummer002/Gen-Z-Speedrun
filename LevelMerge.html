<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Z Speedrun pt.3 - by Dwayne The Rock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;font-family:'Press Start 2P',monospace;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
#game{width:800px;height:500px;position:relative;overflow:hidden;background:#000;border:3px solid #333;image-rendering:pixelated;}
canvas{display:block;image-rendering:pixelated;}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
#aura-display{position:absolute;top:8px;left:8px;font-size:7px;color:#FFD700;background:rgba(0,0,0,0.8);padding:6px 8px;border:2px solid #FFD700;z-index:100;pointer-events:none;line-height:1.6;}
#aura-change{position:absolute;top:40px;left:8px;font-size:7px;font-weight:bold;z-index:100;pointer-events:none;opacity:0;transition:opacity 0.5s;}
#hp-display{position:absolute;top:8px;right:8px;font-size:6px;color:#ff4444;background:rgba(0,0,0,0.8);padding:6px 8px;border:2px solid #ff4444;z-index:100;pointer-events:none;display:none;}
#scene{position:absolute;top:0;left:0;width:100%;height:100%;}
.btn{font-family:'Press Start 2P',monospace;cursor:pointer;border:3px solid;padding:10px 18px;font-size:8px;letter-spacing:1px;image-rendering:pixelated;transition:transform 0.1s,filter 0.1s;}
.btn:hover{transform:scale(1.05);filter:brightness(1.3);}
.btn:active{transform:scale(0.97);}
.btn-green{background:#003300;color:#00FF00;border-color:#00FF00;}
.btn-red{background:#330000;color:#FF4444;border-color:#FF4444;}
.btn-yellow{background:#332200;color:#FFD700;border-color:#FFD700;}
.btn-white{background:#111;color:#fff;border-color:#fff;}
.btn-blue{background:#000033;color:#4444FF;border-color:#4444FF;}
.btn-cyan{background:#003333;color:#00FFFF;border-color:#00FFFF;}
.btn-pink{background:#220033;color:#ff88ff;border-color:#ff88ff;}
.btn-orange{background:#221100;color:#FF8800;border-color:#FF8800;}
.textbox{background:rgba(0,0,0,0.92);border:3px solid #FFD700;padding:12px 16px;font-size:7px;color:#FFD700;line-height:1.8;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:90%;z-index:50;min-height:50px;}
.textbox .speaker{color:#FF9900;font-size:6px;margin-bottom:6px;}
.choice-btn{display:block;width:100%;text-align:left;margin:5px 0;font-family:'Press Start 2P',monospace;font-size:6px;cursor:pointer;background:#001100;color:#00FF00;border:2px solid #00FF00;padding:8px 10px;pointer-events:all;}
.choice-btn:hover{background:#003300;filter:brightness(1.2);}
@keyframes redflash{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
</style>
</head>
<body>
<div id="game">
  <div id="ui">
    <div id="aura-display">⚡ AURA: <span id="aura-val">1500</span></div>
    <div id="aura-change"></div>
    <div id="hp-display">❤️ HP: <span id="hp-val">4</span>/4</div>
  </div>
  <canvas id="scene" width="800" height="500"></canvas>
  <div id="overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
</div>

<script>
// ===================== GLOBALS =====================
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const W = 800, H = 500;

// Starting aura from end of level 2
let aura = 1500;
let hp = 4;
let keys = {};
let animTimer = 0;
let gameState = 'title';
let frameId = null;
let lastTime = 0;

// Player
const P = {x:100, y:320, vx:0, vy:0, facing:1, frame:0, frameTimer:0};

// Hacky sack vars
let sackCount = 0;
let sackBallX = 400, sackBallY = 300;
let sackBallVX = 3, sackBallVY = -5;
let sackBallOnPlayer = false;
let sackPromptKey = '';
let sackPromptTimer = 0;
let tungSackTimer = 0;
let tungX = 600, tungY = 320;
let highFiveTimer = 0;
let sackAuraFreezeTimer = 0;
let groupPassTimer = 0;
let groupType = 'none'; // 'girls' or 'guys'
let groupX = 900;

// Taco Bell vars
let tacoTimer = 60;
let tacoTimerRunning = false;
let ordersPlaced = 0;
let tacoInsideWalked = false;
let chefFight = {active:false, chefs:[], playerHP:4, bat:false};
let tacoScrollX = 0;

// Driving vars
let driveSpeed = 0;
let driveLane = 1; // 0=left, 1=center, 2=right
let driveObstacles = [];
let driveScore = 0;
let driveSpawnTimer = 0;
let driveScrollX = 0;
let driveCrashed = false;
let driveCrashTimer = 0;
let driveFinished = false;

// ===================== HELPERS =====================
function px(n){return Math.round(n);}

function updateAura(delta, label){
  aura = Math.max(0, aura + delta);
  document.getElementById('aura-val').textContent = aura;
  const el = document.getElementById('aura-change');
  el.textContent = (delta>0?'+':'')+delta+' AURA'+(label?' ('+label+')':'');
  el.style.color = delta>0?'#00FF00':'#FF4444';
  el.style.opacity = 1;
  setTimeout(()=>el.style.opacity=0,1500);
}

function clearOverlay(){
  overlay._lastHtml='';
  overlay.innerHTML='';
  overlay.style.pointerEvents='none';
}

function showOverlay(html, clickable=true){
  if(overlay._lastHtml===html) return;
  overlay._lastHtml=html;
  overlay.innerHTML=html;
  overlay.style.pointerEvents=clickable?'all':'none';
}

function drawText(text,x,y,size=7,color='#fff',align='left'){
  ctx.save();
  ctx.font=`${size}px 'Press Start 2P'`;
  ctx.fillStyle=color;
  ctx.textAlign=align;
  ctx.fillText(text,px(x),px(y));
  ctx.restore();
}

function drawPixelRect(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.fillRect(px(x),px(y),px(w),px(h));
}

// ===================== DRAW CHARACTER =====================
function drawPixelChar(x,y,color1='#ffcc99',color2='#2244aa',facing=1,frame=0,sunglasses=false){
  const f=facing<0?-1:1;
  ctx.save();
  ctx.translate(px(x+14),px(y));
  ctx.scale(f,1);
  // shadow
  drawPixelRect(-14,38,28,4,'rgba(0,0,0,0.3)');
  // legs
  const legL=frame%2===0?0:3, legR=frame%2===0?3:0;
  drawPixelRect(-7,28+legL,7,14,color2);
  drawPixelRect(0,28+legR,7,14,color2);
  // shoes
  drawPixelRect(-8,40+legL,9,4,'#222');
  drawPixelRect(0,40+legR,9,4,'#222');
  // body
  drawPixelRect(-10,10,20,20,color2);
  // arms
  const armL=frame%2===0?0:2, armR=frame%2===0?2:0;
  drawPixelRect(-15,12+armL,6,16,'#cc9966');
  drawPixelRect(9,12+armR,6,16,'#cc9966');
  // head
  drawPixelRect(-8,-2,16,14,color1);
  // cap
  drawPixelRect(-9,-8,18,8,'#111');
  drawPixelRect(-6,-12,12,6,'#222');
  // eyes
  if(sunglasses){
    drawPixelRect(-7,1,6,4,'#00ccff');
    drawPixelRect(1,1,6,4,'#00ccff');
    drawPixelRect(-1,1,2,4,'#006699');
  } else {
    drawPixelRect(-5,2,3,3,'#222');
    drawPixelRect(2,2,3,3,'#222');
  }
  // mouth
  drawPixelRect(-3,8,6,2,'#cc6666');
  ctx.restore();
}

// Tung Tung Tung (meme character: big stick, elongated)
function drawTungTung(x,y,frame=0,highFive=false){
  ctx.save();
  ctx.translate(px(x),px(y));
  // shadow
  drawPixelRect(-16,42,32,4,'rgba(0,0,0,0.3)');
  // legs
  const lL=frame%2===0?0:3,lR=frame%2===0?3:0;
  drawPixelRect(-10,24+lL,8,18,'#5C3317');
  drawPixelRect(2,24+lR,8,18,'#5C3317');
  // shoes
  drawPixelRect(-12,40+lL,11,5,'#111');
  drawPixelRect(1,40+lR,11,5,'#111');
  // body (white shirt)
  drawPixelRect(-12,4,24,22,'#fff');
  // arms
  if(highFive){
    drawPixelRect(-20,-2,10,12,'#cc9966'); // left arm up
    drawPixelRect(10,-8,10,12,'#cc9966'); // right arm up
  } else {
    const aL=frame%2===0?0:2,aR=frame%2===0?2:0;
    drawPixelRect(-18,6+aL,8,14,'#cc9966');
    drawPixelRect(10,6+aR,8,14,'#cc9966');
  }
  // head (large, meme-like)
  drawPixelRect(-14,-20,28,26,'#F4C17A');
  // beanie
  drawPixelRect(-15,-28,30,12,'#cc0000');
  drawPixelRect(-12,-32,24,6,'#aa0000');
  // eyes (wide meme eyes)
  drawPixelRect(-10,-14,6,6,'#222');
  drawPixelRect(4,-14,6,6,'#222');
  drawPixelRect(-9,-13,4,4,'#fff');
  drawPixelRect(5,-13,4,4,'#fff');
  // wooden stick
  ctx.fillStyle='#8B5E3C';
  ctx.fillRect(12,4,5,50);
  ctx.fillStyle='#6B3E1C';
  ctx.fillRect(12,4,5,4);
  // name tag
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(px(-14),px(-44),64,14);
  ctx.font="5px 'Press Start 2P'";
  ctx.fillStyle='#FFD700';
  ctx.textAlign='center';
  ctx.fillText('TUNG x3',px(-14)+32,px(-34));
  ctx.textAlign='left';
  ctx.restore();
}

// Chef character
function drawChef(x,y,hp,dead=false,frame=0){
  ctx.save();
  ctx.translate(px(x),px(y));
  if(dead){ctx.rotate(Math.PI/2);ctx.translate(0,-28);}
  // shadow
  if(!dead) drawPixelRect(-14,38,28,4,'rgba(0,0,0,0.3)');
  // legs
  const lL=frame%2===0?0:3,lR=frame%2===0?3:0;
  drawPixelRect(-8,24+lL,8,14,'#555');
  drawPixelRect(0,24+lR,8,14,'#555');
  drawPixelRect(-9,36+lL,10,5,'#222');
  drawPixelRect(0,36+lR,10,5,'#222');
  // body (white apron)
  drawPixelRect(-12,4,24,22,'#eee');
  drawPixelRect(-4,4,8,22,'#ddd');
  // arms with knife
  drawPixelRect(-18,8,8,12,'#cc9966');
  drawPixelRect(10,8,8,12,'#cc9966');
  // knife
  ctx.fillStyle='#ccc';
  ctx.fillRect(px(18),px(4),4,16);
  ctx.fillStyle='#555';
  ctx.fillRect(px(16),px(18),8,4);
  // head
  drawPixelRect(-8,-2,16,12,'#F4C17A');
  // chef hat
  drawPixelRect(-9,-14,18,14,'#fff');
  drawPixelRect(-6,-20,12,8,'#fff');
  // face (angry)
  drawPixelRect(-5,2,3,3,'#222');
  drawPixelRect(2,2,3,3,'#222');
  // angry brows
  ctx.strokeStyle='#222';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(px(-5),px(-1));ctx.lineTo(px(-2),px(1));ctx.stroke();
  ctx.beginPath();ctx.moveTo(px(5),px(-1));ctx.lineTo(px(2),px(1));ctx.stroke();
  drawPixelRect(-3,7,6,2,'#cc2222');
  // HP bar
  if(!dead){
    ctx.fillStyle='#ff0000';
    ctx.fillRect(px(-14),px(-30),28,5);
    ctx.fillStyle='#00ff00';
    ctx.fillRect(px(-14),px(-30),px(28*(hp/4)),5);
  }
  ctx.restore();
}

// Motorcycle scene character (seated)
function drawRider(x,y,frame=0){
  ctx.save();
  ctx.translate(px(x),px(y));
  // body leaning forward
  ctx.rotate(-0.2);
  // torso
  drawPixelRect(-8,-20,18,18,'#2244aa');
  // head
  drawPixelRect(-6,-34,16,16,'#F4C17A');
  // helmet
  drawPixelRect(-8,-38,20,10,'#333');
  drawPixelRect(-6,-42,16,6,'#444');
  // visor
  drawPixelRect(-6,-36,14,6,'rgba(0,200,255,0.5)');
  // legs (bent)
  drawPixelRect(-8,-2,8,16,'#2244aa');
  drawPixelRect(4,-2,8,16,'#2244aa');
  // feet on pegs
  drawPixelRect(-10,12,10,5,'#222');
  drawPixelRect(4,12,10,5,'#222');
  // arms forward
  drawPixelRect(8,-18,14,6,'#cc9966');
  ctx.restore();
}

function drawGirlRider(x,y){
  ctx.save();
  ctx.translate(px(x),px(y));
  ctx.rotate(-0.15);
  // hair blowing
  ctx.fillStyle='#8B4513';
  for(let i=0;i<5;i++) ctx.fillRect(px(-8-i*4),px(-40+i*2),6,4);
  // torso
  drawPixelRect(-8,-20,18,18,'#ff66aa');
  // head
  drawPixelRect(-6,-34,14,14,'#F4C17A');
  // legs
  drawPixelRect(-6,-2,6,14,'#222');
  drawPixelRect(2,-2,6,14,'#222');
  ctx.restore();
}

// Simple motorcycle
function drawMotorcycle(x,y){
  ctx.save();
  ctx.translate(px(x),px(y));
  // frame
  ctx.fillStyle='#111';
  ctx.fillRect(-30,-12,60,14);
  // gas tank
  ctx.fillStyle='#cc2200';
  ctx.fillRect(-14,-20,30,12);
  // exhaust
  ctx.fillStyle='#777';
  ctx.fillRect(28,-4,14,6);
  ctx.fillStyle='#555';
  ctx.fillRect(40,-2,8,4);
  // handlebars
  ctx.fillStyle='#888';
  ctx.fillRect(14,-22,4,10);
  ctx.fillRect(8,-22,20,3);
  // wheels
  ctx.fillStyle='#222';
  ctx.beginPath();ctx.arc(-22,8,14,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(24,8,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#555';
  ctx.beginPath();ctx.arc(-22,8,8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(24,8,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#777';
  ctx.beginPath();ctx.arc(-22,8,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(24,8,3,0,Math.PI*2);ctx.fill();
  // wheel spokes
  ctx.strokeStyle='#444';ctx.lineWidth=1;
  for(let a=0;a<6;a++){
    const an=a*Math.PI/3;
    ctx.beginPath();ctx.moveTo(-22,8);ctx.lineTo(-22+Math.cos(an)*11,8+Math.sin(an)*11);ctx.stroke();
    ctx.beginPath();ctx.moveTo(24,8);ctx.lineTo(24+Math.cos(an)*11,8+Math.sin(an)*11);ctx.stroke();
  }
  // exhaust smoke
  ctx.fillStyle='rgba(200,200,200,0.2)';
  ctx.beginPath();ctx.arc(50+Math.random()*10,-4+Math.random()*6,6,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ===================== BACKGROUNDS =====================
function drawSchoolHallway(){
  // floor
  ctx.fillStyle='#c8b090';
  ctx.fillRect(0,300,W,200);
  for(let x=0;x<W;x+=60){
    for(let y=300;y<500;y+=60){
      ctx.strokeStyle='#b09070';ctx.lineWidth=1;
      ctx.strokeRect(x,y,60,60);
    }
  }
  // ceiling
  ctx.fillStyle='#e0e0d0';
  ctx.fillRect(0,0,W,80);
  // walls
  ctx.fillStyle='#d4c8a0';
  ctx.fillRect(0,80,W,220);
  // locker banks
  for(let lx=0;lx<W;lx+=28){
    if(lx%56===0){
      ctx.fillStyle='#6688aa';
    } else {
      ctx.fillStyle='#5577aa';
    }
    ctx.fillRect(lx,90,26,180);
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.fillRect(lx+2,92,22,176);
    ctx.fillStyle='#cc9900';
    ctx.fillRect(lx+10,170,6,6);
    // vent
    ctx.strokeStyle='#4466aa';ctx.lineWidth=1;
    ctx.strokeRect(lx+4,130,18,20);
    for(let vy=132;vy<148;vy+=4){
      ctx.beginPath();ctx.moveTo(lx+4,vy);ctx.lineTo(lx+22,vy);ctx.stroke();
    }
  }
  // ceiling lights
  for(let lx=80;lx<W;lx+=160){
    ctx.fillStyle='rgba(255,250,200,0.8)';
    ctx.fillRect(lx,0,80,14);
    ctx.fillStyle='rgba(255,255,150,0.15)';
    ctx.beginPath();ctx.moveTo(lx,14);ctx.lineTo(lx-40,300);ctx.lineTo(lx+120,300);ctx.lineTo(lx+80,14);ctx.closePath();ctx.fill();
  }
  // hallway arrows (school style)
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.font="9px 'Press Start 2P'";ctx.textAlign='center';
  ctx.fillText('→ KEEP RIGHT',W/2,76);ctx.textAlign='left';
}

function drawTacoBellOutside(){
  // sky
  ctx.fillStyle='#0a0a2e';
  ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='#fff';
  for(let i=0;i<30;i++){
    ctx.fillRect((i*197+Math.floor(animTimer*.1))%W,(i*89)%140,1+(i%4===0?1:0),1);
  }
  // road
  ctx.fillStyle='#333';ctx.fillRect(0,360,W,140);
  ctx.fillStyle='#FFD700';
  for(let rx=(animTimer*2)%60;rx<W;rx+=60){
    ctx.fillRect(rx,425,40,6);
  }
  // sidewalk
  ctx.fillStyle='#aaa';ctx.fillRect(0,320,W,42);
  for(let sx=0;sx<W;sx+=40){ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.strokeRect(sx,320,40,42);}
  // building
  ctx.fillStyle='#cc2200';ctx.fillRect(120,40,560,280);
  // roof bell logo area
  ctx.fillStyle='#7B1FA2';ctx.fillRect(280,40,240,50);
  // TACO BELL text
  ctx.font="bold 14px 'Press Start 2P'";ctx.fillStyle='#FFD700';ctx.textAlign='center';
  ctx.fillText('TACO BELL',W/2,74);ctx.textAlign='left';
  // windows
  ctx.fillStyle='rgba(255,240,100,0.5)';
  [[140,80,100,80],[460,80,100,80],[140,180,100,60],[460,180,100,60]].forEach(([wx,wy,ww,wh])=>{
    ctx.fillRect(wx,wy,ww,wh);
    ctx.strokeStyle='#884422';ctx.lineWidth=4;ctx.strokeRect(wx,wy,ww,wh);
  });
  // door
  ctx.fillStyle='#8B4513';ctx.fillRect(350,220,100,100);
  ctx.fillStyle='rgba(255,220,100,0.3)';ctx.fillRect(356,226,88,94);
  ctx.strokeStyle='#cc6600';ctx.lineWidth=3;ctx.strokeRect(350,220,100,100);
  ctx.fillStyle='#FFD700';ctx.fillRect(443,270,8,8);
  // closing sign
  ctx.fillStyle='#ff0000';ctx.fillRect(250,150,300,50);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(250,150,300,50);
  ctx.font="8px 'Press Start 2P'";ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.fillText('CLOSING IN 1 MINUTE',W/2,180);ctx.textAlign='left';
}

function drawTacoBellInside(){
  // floor tiles
  ctx.fillStyle='#f5e8c0';ctx.fillRect(0,300,W,200);
  for(let tx=0;tx<W;tx+=40){for(let ty=300;ty<500;ty+=40){ctx.strokeStyle='#ddd0a0';ctx.lineWidth=1;ctx.strokeRect(tx,ty,40,40);}}
  // ceiling
  ctx.fillStyle='#aa2200';ctx.fillRect(0,0,W,50);
  ctx.font="bold 10px 'Press Start 2P'";ctx.fillStyle='#FFD700';ctx.textAlign='center';
  ctx.fillText('TACO BELL',W/2,32);ctx.textAlign='left';
  // purple accent stripe
  ctx.fillStyle='#7B1FA2';ctx.fillRect(0,50,W,18);
  // walls
  ctx.fillStyle='#d4a890';ctx.fillRect(0,68,W,232);
  // tables
  [[100,220],[250,220],[500,220],[650,220],[180,310],[560,310]].forEach(([tx,ty])=>{
    ctx.fillStyle='#8B4513';ctx.fillRect(tx,ty,70,30);
    ctx.fillStyle='#cc6600';ctx.fillRect(tx-4,ty-4,78,8);
    ctx.fillStyle='#5C3317';ctx.fillRect(tx+5,ty+28,14,16);ctx.fillRect(tx+50,ty+28,14,16);
  });
  // VERY VISIBLE WARNING SIGN
  ctx.fillStyle='#ff0000';ctx.fillRect(160,70,480,70);
  ctx.strokeStyle='#FFD700';ctx.lineWidth=4;ctx.strokeRect(160,70,480,70);
  // flashing border
  const flashA=0.5+0.5*Math.sin(animTimer*0.2);
  ctx.strokeStyle=`rgba(255,255,0,${flashA})`;ctx.lineWidth=6;ctx.strokeRect(158,68,484,74);
  ctx.font="7px 'Press Start 2P'";ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.fillText('Welcome to Taco Bell',W/2,98);
  ctx.fillText('Please don\'t rage bait us by ordering',W/2,112);
  ctx.fillText('10+ items one minute before closing',W/2,126);
  ctx.textAlign='left';
  // counter
  ctx.fillStyle='#8B4513';ctx.fillRect(550,200,250,160);
  ctx.fillStyle='#cc6600';ctx.fillRect(548,196,254,10);
  // menu board
  ctx.fillStyle='#1a1a1a';ctx.fillRect(560,70,200,120);
  ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.strokeRect(560,70,200,120);
  ctx.font="5px 'Press Start 2P'";ctx.fillStyle='#FFD700';ctx.textAlign='center';
  ctx.fillText('MENU',660,88);
  ctx.fillStyle='#fff';
  ['Baja Blast $3','Dorito Taco $2','Ranch Burrito $4','Lava Chicken $5','Skibidi Wrap $6'].forEach((item,i)=>{
    ctx.fillText(item,660,104+i*14);
  });
  ctx.textAlign='left';
  // cashier (TB employee)
  ctx.fillStyle='#F4C17A';ctx.fillRect(620,160,28,26);
  ctx.fillStyle='#7B1FA2';ctx.fillRect(614,184,40,40);
  ctx.fillStyle='#111';ctx.fillRect(618,156,32,8);
  ctx.fillStyle='#FFD700';ctx.fillRect(618,154,32,4);
}

function drawDriveBackground(scrollX){
  // night sky
  ctx.fillStyle='#050518';ctx.fillRect(0,0,W,H);
  // moon
  ctx.fillStyle='#ffffcc';ctx.beginPath();ctx.arc(720,50,30,0,Math.PI*2);ctx.fill();

let schoolWalkX = 120;

function initSchoolWalk(){
  P.x=120;P.y=330;P.vx=0;P.vy=0;P.facing=1;P.frame=0;schoolWalkDone=false;
  sackCount=0;sackBallX=400;sackBallY=280;sackBallVX=3;sackBallVY=-4;
  sackOnPlayer=false;sackPromptKey='';sackPromptTimer=0;tungSackTimer=0;
  tungX=620;tungY=325;groupPassTimer=Math.floor(60+Math.random()*120);groupX=900;groupType='none';
}

let sackOnPlayer=false;
const KEYS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

function drawSchoolWalk(dt){
  drawSchoolHallway();
  // OBJECTIVE banner
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,30);
  drawText('PART 1: HACKY SACK  —  SACKS: '+sackCount+'/10',W/2,20,6,'#FFD700','center');
  // controls
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,470,W,30);
  ctx.font="5px 'Press Start 2P'";ctx.fillStyle='#888';ctx.textAlign='center';
  ctx.fillText('W/A/S/D = MOVE  |  HIT THE KEY SHOWN ABOVE YOUR HEAD WHEN THE SACK IS NEAR',W/2,487);ctx.textAlign='left';
  // Tung Tung Tung
  drawTungTung(tungX-14,tungY-40,Math.floor(animTimer*0.1)%4);
  // Sack ball (hacky sack = small colored ball)
  const hackColor=['#00ff88','#ff6600','#ff00ff','#ffff00'];
  ctx.fillStyle=hackColor[Math.floor(animTimer/20)%4];
  ctx.beginPath();ctx.arc(px(sackBallX),px(sackBallY),7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;ctx.stroke();
  // ball shadow
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(px(sackBallX),355,7,3,0,0,Math.PI*2);ctx.fill();
  // prompt key above player head
  if(sackPromptTimer>0 && sackPromptKey){
    sackPromptTimer-=dt;
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(px(P.x-4),px(P.y-60),28,26);
    ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.strokeRect(px(P.x-4),px(P.y-60),28,26);
    ctx.font="10px 'Press Start 2P'";ctx.fillStyle='#FFD700';ctx.textAlign='center';
    ctx.fillText(sackPromptKey,px(P.x+10),px(P.y-42));ctx.textAlign='left';
  }
  // player
  drawPixelChar(P.x,P.y,'#ffcc99','#2244aa',P.facing,P.frame);
  // Group of people passing
  groupPassTimer-=dt;
  if(groupPassTimer<=0){
    groupType=Math.random()>0.4?'girls':'guys';
    groupX=820;groupPassTimer=999999;
  }
  if(groupType!=='none'){
    groupX-=1.5*dt;
    // draw group
    const colors=groupType==='girls'?['#ff66aa','#ff88cc','#ee44bb']:['#4488ff','#3366cc','#2255aa'];
    for(let gi=0;gi<3;gi++){
      const gx=groupX+gi*36,gy=330;
      ctx.fillStyle=colors[gi%colors.length];ctx.fillRect(px(gx),py(gy-30),18,30);
      ctx.fillStyle='#F4C17A';ctx.fillRect(px(gx+3),py(gy-46),12,16);
      ctx.fillStyle='#222';ctx.fillRect(px(gx),py(gy-50),14,8);
    }
    if(groupX<-120){
      groupType='none';groupX=900;groupPassTimer=Math.floor(60+Math.random()*180);
    }
  }
  // update ball physics
  sackBallX+=sackBallVX*dt;
  sackBallY+=sackBallVY*dt;
  sackBallVY+=0.35*dt;
  // bounce off walls
  if(sackBallX<20){sackBallX=20;sackBallVX=Math.abs(sackBallVX);}
  if(sackBallX>W-20){sackBallX=W-20;sackBallVX=-Math.abs(sackBallVX);}
  if(sackBallY>348){sackBallY=348;sackBallVY=-Math.abs(sackBallVY)*0.7;}
  // check near player
  const pdx=sackBallX-(P.x+14),pdy=sackBallY-(P.y+10);
  const playerDist=Math.sqrt(pdx*pdx+pdy*pdy);
  if(playerDist<40 && sackBallVY>0 && sackPromptTimer<=0 && sackCount<10){
    // show prompt
    sackPromptKey=KEYS[Math.floor(Math.random()*KEYS.length)];
    sackPromptTimer=60;
    sackOnPlayer=true;
  }
  // check near tung
  const tdx=sackBallX-(tungX),tdy=sackBallY-(tungY-20);
  const tungDist=Math.sqrt(tdx*tdx+tdy*tdy);
  if(tungDist<50 && sackBallVY>0){
    // Tung has 90% accuracy
    if(Math.random()<0.9){
      sackBallVX=(P.x>tungX?-1:1)*(2+Math.random()*3);
      sackBallVY=-(5+Math.random()*3);
    } else {
      sackBallVX=(Math.random()-.5)*6;sackBallVY=-2;
    }
  }
  // player movement
  if(keys['KeyA']||keys['ArrowLeft']){P.vx=-2;P.facing=-1;}
  else if(keys['KeyD']||keys['ArrowRight']){P.vx=2;P.facing=1;}
  else P.vx*=0.7;
  if(keys['KeyW']||keys['ArrowUp']){P.vy=-1.5;}
  else if(keys['KeyS']||keys['ArrowDown']){P.vy=1.5;}
  else P.vy*=0.7;
  P.x=Math.max(10,Math.min(W-40,P.x+P.vx*dt));
  P.y=Math.max(280,Math.min(380,P.y+P.vy*dt));
  if(Math.abs(P.vx)+Math.abs(P.vy)>0.3){P.frameTimer+=dt;if(P.frameTimer>6){P.frame=(P.frame+1)%4;P.frameTimer=0;}}
  // sack count bar
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(8,36,200,16);
  ctx.fillStyle='#00ff88';ctx.fillRect(8,36,sackCount/10*200,16);
  ctx.strokeStyle='#00ff88';ctx.lineWidth=1;ctx.strokeRect(8,36,200,16);
  if(sackCount>=10 && !schoolWalkDone){
    schoolWalkDone=true;
    goState('high_five_anim');
  }
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(gameState==='school_walk'){
    if(sackOnPlayer && sackPromptKey && sackPromptTimer>0){
      const pressed=e.key.toUpperCase();
      if(pressed===sackPromptKey){
        // correct key!
        sackCount++;
        // aura gain for girls passing
        if(groupType==='girls') updateAura(50,'🔥 Sacked in front of girls!');
        sackBallVX=(tungX>P.x?1:-1)*(2+Math.random()*3);
        sackBallVY=-(6+Math.random()*4);
        sackOnPlayer=false;sackPromptTimer=0;sackPromptKey='';
      } else {
        // wrong key - ball drops, no sack streak break (just miss)
        sackBallVX=(Math.random()-.5)*4;sackBallVY=-1;
        sackOnPlayer=false;sackPromptTimer=0;sackPromptKey='';
        sackCount=0; // reset streak
      }
    }
  }
  if(gameState==='taco_walk' || gameState==='school_walk'){
    e.preventDefault();
  }
  // driving arrow keys
  if(gameState==='driving'){
    if(e.code==='ArrowLeft'&&driveLane>0) driveLane--;
    if(e.code==='ArrowRight'&&driveLane<2) driveLane++;
    e.preventDefault();
  }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

// ===================== CHEF FIGHT =====================
let chefs=[];
let playerBatCooldown=0;
let batSwinging=false;
let batTimer=0;
let chefFightOver=false;
let chefPlayerHP=4;

function initChefFight(){
  chefs=[];
  for(let i=0;i<4;i++){
    chefs.push({x:500+i*60,y:280+i*20,hp:4,dead:false,vx:-0.5-i*0.1,vy:0,frame:0,frameTimer:0,attackTimer:60+i*30,stun:0});
  }
  chefPlayerHP=4;hp=4;document.getElementById('hp-val').textContent=4;
  document.getElementById('hp-display').style.display='block';
  P.x=120;P.y=320;P.facing=1;playerBatCooldown=0;batSwinging=false;chefFightOver=false;
}

function drawChefFight(dt){
  drawTacoBellInside();
  // controls
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,470,W,30);
  ctx.font="5px 'Press Start 2P'";ctx.fillStyle='#888';ctx.textAlign='center';
  ctx.fillText('W/A/S/D = MOVE  |  E = SWING BAT  |  Defeat all 4 chefs!',W/2,487);ctx.textAlign='left';
  // header
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,28);
  drawText('CHEF BATTLE — '+chefs.filter(c=>!c.dead).length+' CHEFS REMAINING',W/2,18,6,'#FF4444','center');
  // player HP bar
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(200,0,160,12);
  for(let hi=0;hi<4;hi++){
    ctx.fillStyle=hi<chefPlayerHP?'#ff4444':'#333';
    ctx.fillRect(202+hi*38,1,36,10);
  }
  // player movement
  if(keys['KeyA']||keys['ArrowLeft']){P.vx=-2;P.facing=-1;}
  else if(keys['KeyD']||keys['ArrowRight']){P.vx=2;P.facing=1;}
  else P.vx*=0.7;
  if(keys['KeyW']||keys['ArrowUp']){P.vy=-1.5;}
  else if(keys['KeyS']||keys['ArrowDown']){P.vy=1.5;}
  else P.vy*=0.7;
  P.x=Math.max(10,Math.min(W-40,P.x+P.vx*dt));
  P.y=Math.max(140,Math.min(400,P.y+P.vy*dt));
  if(Math.abs(P.vx)+Math.abs(P.vy)>0.3){P.frameTimer+=dt;if(P.frameTimer>6){P.frame=(P.frame+1)%4;P.frameTimer=0;}}
  // bat cooldown
  if(playerBatCooldown>0) playerBatCooldown-=dt;
  if(batTimer>0){batTimer-=dt;batSwinging=true;}else{batSwinging=false;}
  // draw player
  drawPixelChar(P.x,P.y,'#ffcc99','#2244aa',P.facing,P.frame);
  // baseball bat
  const batX=P.x+(P.facing>0?28:-14),batY=P.y+10;
  ctx.fillStyle='#8B5E3C';
  if(batSwinging){
    ctx.save();ctx.translate(batX,batY);ctx.rotate(P.facing*(-0.8+batTimer*0.04));
    ctx.fillRect(-3,-28,6,34);ctx.fillStyle='#cc8844';ctx.fillRect(-5,-32,10,8);
    ctx.restore();
  } else {
    ctx.fillRect(batX-3,batY-26,6,32);ctx.fillStyle='#cc8844';ctx.fillRect(batX-4,batY-30,8,7);
  }
  // update + draw chefs
  chefs.forEach((c,ci)=>{
    if(c.dead){drawChef(c.x,c.y,0,true,0);return;}
    // move toward player
    const cdx=P.x-c.x,cdy=P.y-c.y;
    const cd=Math.sqrt(cdx*cdx+cdy*cdy);
    if(c.stun>0){c.stun-=dt;}
    else if(cd>60){c.x+=cdx/cd*0.6*dt;c.y+=cdy/cd*0.4*dt;}
    c.frameTimer+=dt;if(c.frameTimer>10){c.frame=(c.frame+1)%4;c.frameTimer=0;}
    // chef attacks player
    if(cd<45&&c.attackTimer<=0&&c.stun<=0){
      chefPlayerHP=Math.max(0,chefPlayerHP-1);
      hp=chefPlayerHP;
      document.getElementById('hp-val').textContent=hp;
      updateAura(-100,'chef hit');
      c.attackTimer=90+ci*20;
      if(chefPlayerHP<=0){goState('chef_game_over');return;}
    }
    if(c.attackTimer>0)c.attackTimer-=dt;
    // draw
    drawChef(c.x,c.y,c.hp,false,c.frame);
    // check bat hit
    if(batSwinging&&!c.dead){
      const bx=P.x+(P.facing>0?28:-14),by=P.y+10;
      const hdx=c.x-bx,hdy=c.y-by;
      if(Math.sqrt(hdx*hdx+hdy*hdy)<50){
        c.hp--;c.stun=40;
        if(c.hp<=0){c.dead=true;updateAura(100,'chef defeated!');}
      }
    }
  });
  // Check all dead
  if(!chefFightOver&&chefs.every(c=>c.dead)){
    chefFightOver=true;
    updateAura(500,'ALL CHEFS DEFEATED!');
    setTimeout(()=>goState('taco_eating_anim'),1000);
  }
}

// ===================== DRIVING (Subway Surfers style) =====================
const LANE_Y=[300,355,410];
const OBSTACLE_TYPES=[
  {label:'SKIBIDI TOILET',color:'#4488ff',width:40,height:50,lanes:1,aura:1},
  {label:'TIKTOK AD',color:'#ff2d55',width:70,height:40,lanes:1,aura:1},
  {label:'KIM JONG UN',color:'#ff4400',width:50,height:60,lanes:1,aura:1},
  {label:'PHONE TEEN',color:'#8844ff',width:30,height:55,lanes:1,aura:1},
  {label:'GO FAST! -SONIC',color:'#3366cc',width:55,height:55,lanes:1,aura:1},
];
const WIDE_TYPES=[
  {label:'I SHOW SPEED + CROWD',color:'#ff6600',width:200,height:60,lanes:3,aura:3},
];

function initDriving(){
  driveLane=1;driveObstacles=[];driveScore=0;driveSpawnTimer=0;
  driveScrollX=0;driveCrashed=false;driveCrashTimer=0;driveFinished=false;
  driveSpeed=2.5;
}

function drawDriving(dt){
  driveScrollX+=driveSpeed*dt;
  drawDriveBackground(driveScrollX);
  // spawn obstacles
  driveSpawnTimer-=dt;
  if(driveSpawnTimer<=0){
    // chance for wide obstacle
    const wide=Math.random()<0.12;
    if(wide){
      const t=WIDE_TYPES[0];
      driveObstacles.push({x:W+50,y:LANE_Y[1]-30,w:t.width,h:t.height,type:t,lanes:3,lane:-1,active:true});
    } else {
      const lane=Math.floor(Math.random()*3);
      const t=OBSTACLE_TYPES[Math.floor(Math.random()*OBSTACLE_TYPES.length)];
      driveObstacles.push({x:W+30,y:LANE_Y[lane]-t.height/2,w:t.width,h:t.height,type:t,lane,lanes:1,active:true});
    }
    driveSpawnTimer=Math.max(40,120-driveScore*0.3);
  }
  // move obstacles
  driveObstacles=driveObstacles.filter(o=>{
    o.x-=driveSpeed*dt*3;
    if(!o.active) return false;
    // draw obstacle
    ctx.fillStyle=o.type.color;
    ctx.fillRect(px(o.x),px(o.y),o.w,o.h);
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.strokeRect(px(o.x),px(o.y),o.w,o.h);
    ctx.font="4px 'Press Start 2P'";ctx.fillStyle='#fff';ctx.textAlign='center';
    const lines=o.type.label.split('+');
    lines.forEach((l,i)=>ctx.fillText(l.trim(),px(o.x+o.w/2),px(o.y+o.h/2-4+i*12)));
    ctx.textAlign='left';
    // draw icon based on type
    if(o.type.label==='SKIBIDI TOILET'){
      ctx.fillStyle='#fff';ctx.fillRect(px(o.x+8),px(o.y+4),24,30);
      ctx.fillStyle='#4488ff';ctx.fillRect(px(o.x+12),px(o.y),16,10);
    } else if(o.type.label.includes('SONIC')){
      ctx.fillStyle='#fff';ctx.font="10px serif";ctx.fillText('💨',px(o.x+5),px(o.y+18));
    }
    return o.x>-200;
  });
  // player motorcycle
  const playerY=LANE_Y[driveLane];
  drawMotorcycle(180,playerY+20);
  drawRider(158,playerY);
  drawGirlRider(200,playerY+10);
  // crash flash
  if(driveCrashed&&driveCrashTimer>0){
    driveCrashTimer-=dt;
    ctx.fillStyle=`rgba(255,0,0,${Math.min(0.5,driveCrashTimer/30)})`;
    ctx.fillRect(0,0,W,H);
    if(driveCrashTimer<=0){driveCrashed=false;}
  }
  // collision check
  driveObstacles.forEach(o=>{
    if(!o.active) return;
    const oy=o.y, oh=o.h;
    const py2=playerY-30, ph=60;
    const px2=140, pw=80;
    if(o.x<px2+pw&&o.x+o.w>px2&&oy<py2+ph&&oy+oh>py2){
      o.active=false;
      // crash!
      aura=Math.floor(aura/2);
      document.getElementById('aura-val').textContent=aura;
      driveCrashed=true;driveCrashTimer=60;
      showOverlay(`
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);border:3px solid #FF4444;padding:20px;text-align:center;">
          <div style="font-family:'Press Start 2P',monospace;font-size:12px;color:#FF4444;margin-bottom:14px;">CRASHED!</div>
          <div style="font-family:'Press Start 2P',monospace;font-size:7px;color:#ff8800;margin-bottom:18px;">AURA HALVED!</div>
          <button class="btn btn-red" onclick="restartDrive()">TRY AGAIN</button>
        </div>
      `);
      goState('drive_game_over');
    }
  });
  // score = dodges (obstacles that pass off screen)
  driveObstacles.forEach(o=>{
    if(o.active&&o.x<100&&!o.scored){o.scored=true;driveScore++;updateAura(1,'dodged!');}
  });
  // speed ramp
  driveSpeed=Math.min(6,2.5+driveScore*0.02);
  // UI
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,30);
  drawText('🏍️  OHIO DRIVE  |  DODGED: '+driveScore+'  |  AURA: '+aura,W/2,20,6,'#00ffff','center');
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,470,W,30);
  ctx.font="5px 'Press Start 2P'";ctx.fillStyle='#888';ctx.textAlign='center';
  ctx.fillText('← → ARROW KEYS = SWITCH LANES  |  Thick of It playing 🎵',W/2,487);ctx.textAlign='left';
  // Ohio sign after enough distance
  if(driveScore>=30&&!driveFinished){
    driveFinished=true;
    // draw ohio sign across screen
    goState('ohio_arrive');
  }
}

function restartDrive(){clearOverlay();initDriving();goState('driving');}

// ===================== DRIVE GAME OVER =====================
function drawDriveGameOver(){
  ctx.fillStyle='#0a0000';ctx.fillRect(0,0,W,H);
  for(let i=0;i<20;i++){ctx.fillStyle=`rgba(200,0,0,${0.04+0.04*(i%3)})`;ctx.fillRect(0,i*26,W,24);}
  drawText('GAME OVER',W/2,180,22,'#FF4444','center');
  drawText('You crashed!',W/2,240,7,'#ff8800','center');
  drawText('AURA halved.',W/2,268,6,'#FF4444','center');
}

// ===================== OHIO ARRIVE =====================
let ohioT=0;
function initOhioArrive(){ohioT=0;updateAura(100,'Arrived in Ohio!');}
function drawOhioArrive(){
  ohioT++;
  drawDriveBackground(ohioT);
  // Bike stopped
  drawMotorcycle(300,380);drawRider(278,360);drawGirlRider(320,370);
  // Ohio sign (HUGE)
  ctx.fillStyle='#003366';ctx.fillRect(150,60,500,200);
  ctx.strokeStyle='#FFD700';ctx.lineWidth=6;ctx.strokeRect(150,60,500,200);
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(162,72,476,176);
  ctx.font="bold 22px 'Press Start 2P'";ctx.fillStyle='#FFD700';ctx.textAlign='center';
  ctx.fillText('WELCOME TO',W/2,120);
  ctx.font="bold 28px 'Press Start 2P'";ctx.fillStyle='#fff';
  ctx.fillText('OHIO',W/2,170);
  ctx.font="9px 'Press Start 2P'";ctx.fillStyle='#aaaaff';
  ctx.fillText('+100 AURA GAINED',W/2,210);ctx.textAlign='left';
  // Confetti
  for(let i=0;i<30;i++){
    const cx=((i*137+ohioT*3)%W+W)%W;
    const cy=((i*89+ohioT*2)%400);
    ctx.fillStyle=['#FFD700','#FF4444','#00FF00','#00FFFF','#ff88ff'][i%5];
    ctx.fillRect(cx,cy,5,5);
  }
  if(ohioT>240){
    goState('ending');
  }
}

// ===================== ENDING =====================
let endT=0;
function initEnding(){endT=0;}
function drawEnding(){
  endT++;
  ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){
    ctx.globalAlpha=0.2+0.8*Math.abs(Math.sin(endT*.025+i*.4));
    ctx.fillStyle='#FFD700';ctx.fillRect((i*137+endT*.4)%W,(i*89+endT*.2)%H,3,3);
  }
  ctx.globalAlpha=1;
  // fireworks
  for(let i=0;i<8;i++){
    const fw_x=(i*120+50)%W;
    const fw_y=60+i*30;
    for(let j=0;j<8;j++){
      const a=j*Math.PI/4+endT*0.05;
      const r=(endT%80)*1.2;
      const cc=['#FFD700','#ff6600','#ff00ff','#00ffff','#ff0000','#00ff88','#ff88ff','#4488ff'][j];
      ctx.fillStyle=cc;ctx.globalAlpha=Math.max(0,1-r/80);
      ctx.fillRect(px(fw_x+Math.cos(a)*r),px(fw_y+Math.sin(a)*r),4,4);
    }
  }
  ctx.globalAlpha=1;
  // panel
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(120,100,560,280);
  ctx.strokeStyle='#FFD700';ctx.lineWidth=4;ctx.strokeRect(120,100,560,280);
  ctx.fillStyle='#FFD700';
  [[120,100],[676,100],[120,376],[676,376]].forEach(([cx,cy])=>{ctx.fillRect(cx-5,cy-5,14,14);});
  drawText('LEVEL 3 COMPLETE!',W/2,148,10,'#FFD700','center');
  drawText('AURA: '+aura,W/2,180,9,'#00FF00','center');
  // flicker
  const fa=0.5+0.5*Math.sin(endT*0.1);
  ctx.fillStyle=`rgba(255,215,0,${fa})`;ctx.font="7px 'Press Start 2P'";ctx.textAlign='center';
  ctx.fillText('You made it to Ohio. No cap.',W/2,218);ctx.textAlign='left';
  ctx.fillStyle='rgba(255,136,0,0.9)';ctx.font="8px 'Press Start 2P'";ctx.textAlign='center';
  ctx.fillText('⚠ LEVEL 4 COMING SOON ⚠',W/2,256);ctx.textAlign='left';
  drawText('Made by Dwayne The Rock',W/2,300,5,'#555','center');
  // character doing victory dance
  const frame=Math.floor(endT/10)%4;
  drawPixelChar(170,310,'#ffcc99','#2244aa',1,frame,true);
}

// ===================== MAIN LOOP =====================
function gameLoop(ts){
  const dt=Math.min((ts-lastTime)/16.7,3);lastTime=ts;
  animTimer+=dt;
  ctx.clearRect(0,0,W,H);

  if(gameState==='title') drawTitle();
  else if(gameState==='part1_intro') drawPart1Intro();
  else if(gameState==='game_over_41') drawGameOver41();
  else if(gameState==='school_walk'){if(!schoolWalkDone)drawSchoolWalk(dt);}
  else if(gameState==='school_walk_intro'){
    // brief intro then start school
    initSchoolWalk();initGirlWalk();goState('school_walk');
  }
  else if(gameState==='high_five_anim') drawHighFive();
  else if(gameState==='part2_intro') drawPart2Intro();
  else if(gameState==='taco_outside') drawTacoOutside(dt);
  else if(gameState==='taco_inside') drawTacoInside(dt);
  else if(gameState==='taco_game_over') drawTacoGameOver();
  else if(gameState==='chef_fight_intro') drawChefFightIntro();
  else if(gameState==='chef_fight') drawChefFight(dt);
  else if(gameState==='chef_game_over') drawChefGameOver();
  else if(gameState==='taco_eating_anim'){if(eatAnimT===0)initEatAnim();drawEatAnim();}
  else if(gameState==='part3_intro') drawPart3Intro();
  else if(gameState==='girl_walk') drawGirlWalk(dt);
  else if(gameState==='girl_dialogue') drawGirlDialogue();
  else if(gameState==='drive_intro'){if(driveIntroT===0)initDriveIntro();drawDriveIntro();}
  else if(gameState==='driving') drawDriving(dt);
  else if(gameState==='drive_game_over') drawDriveGameOver();
  else if(gameState==='ohio_arrive'){if(ohioT===0)initOhioArrive();drawOhioArrive();}
  else if(gameState==='ending'){if(endT===0)initEnding();drawEnding();}

  frameId=requestAnimationFrame(gameLoop);
}

// ===================== START =====================
gameLoop(0);
</script>
